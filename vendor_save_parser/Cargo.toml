[package]
name = "parser"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.4"

[features]
# Dev-only diagnostic: prints each block's tag/depth/byte-position as the
# reader enters/exits it. Off by default (adds eprintln! calls that would
# otherwise be dead weight in the shipped, console-less .exe).
trace-blocks = []
